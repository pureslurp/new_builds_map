<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>New-build communities in Oakland County, Michigan</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", Helvetica, Arial, sans-serif; color: #1f2933; }
  #map { position: absolute; inset: 0; }
  .panel {
    position: absolute; z-index: 500; top: 12px; left: 12px;
    width: 280px; max-height: calc(100% - 24px); overflow: auto;
    background: rgba(255,255,255,0.96); border-radius: 10px;
    box-shadow: 0 8px 28px rgba(15, 23, 42, 0.18); padding: 14px 14px 10px;
  }
  .panel h1 { font-size: 16px; line-height: 1.3; margin: 0 0 4px; }
  .panel p.sub { margin: 0 0 10px; font-size: 12px; color: #52606d; }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 4px 0; }
  .swatch { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); flex: none; }
  .group-label { margin: 12px 0 4px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: #52606d; font-weight: 700; }
  ul.places { list-style: none; margin: 0; padding: 0 0 8px; }
  ul.places li { margin: 0; }
  ul.places button {
    width: 100%; text-align: left; background: none; border: 0; padding: 4px 2px;
    font: inherit; font-size: 13px; cursor: pointer; color: #1f2933; border-radius: 4px;
  }
  ul.places button:hover { background: #f0f4f8; }
  .miss { font-size: 12px; color: #52606d; margin: 8px 0 4px; line-height: 1.35; }
  .filter-section { margin: 10px 0 8px; }
  .filter-section label { display: block; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: #52606d; font-weight: 700; margin-bottom: 4px; }
  .filter-section select { width: 100%; padding: 6px 8px; font: inherit; font-size: 13px; border: 1px solid #cbd5e0; border-radius: 4px; background: #fff; }
  .leaflet-popup-content { margin: 10px 12px; font-size: 13px; line-height: 1.35; }
  .leaflet-popup-content strong { display: block; font-size: 14px; margin-bottom: 2px; }
  .popup-detail { margin: 2px 0; }
  .osm { color: #52606d; font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>New Builds in Oakland County</h1>
  <p class="sub">Pins are OpenStreetMap Nominatim matches only. Click a community to center it.</p>
  <div class="filter-section">
    <label for="builder-filter">Filter by builder</label>
    <select id="builder-filter">
      <option value="">All builders</option>
    </select>
  </div>
  <div class="filter-section">
    <label for="city-filter">Filter by city</label>
    <select id="city-filter">
      <option value="">All cities</option>
    </select>
  </div>
  <div id="legend"></div>
  <div id="lists"></div>
  <p class="miss">Not shown (no accepted geocode): Forest Edge, Meadows of Lyon, Aspen Ridge, The Townes at Main Street, The Villas at Waldon Village, Townes at Waldon Village, Cattails Preserve.</p>
</div>
<script>
const COMMUNITIES = [{"name": "Pinehurst", "group": "BUILT, single-family", "product": "single-family", "lat": 42.4652948, "lon": -83.6309561, "geocode_query": "", "display_name": "Lyon Township", "builder": "Pulte", "home_type": "single-family", "year_built": 2017, "value_estimate": 695000.0, "value_source": "recent comps, 3 closings in 2025-2026"}, {"name": "Greystone Village", "group": "BUILT, single-family", "product": "single-family", "lat": 42.4404187, "lon": -83.6282662, "geocode_query": "", "display_name": "Lyon Township", "builder": "Pulte", "home_type": "single-family", "year_built": "", "value_estimate": "", "value_source": ""}, {"name": "Tanglewood Greenbrier", "group": "BUILT, single-family", "product": "single-family", "lat": 42.4561822, "lon": -83.5841177, "geocode_query": "", "display_name": "Lyon Township", "builder": "Pulte", "home_type": "single-family", "year_built": "", "value_estimate": 1000000.0, "value_source": "recent comps, Greenbrier section only, 4 closings late 2025 to early 2026"}, {"name": "Berkshire Pointe", "group": "BUILT, single-family", "product": "single-family", "lat": 42.4920678, "lon": -83.5383055, "geocode_query": "", "display_name": "Novi", "builder": "Pulte", "home_type": "single-family", "year_built": "", "value_estimate": "", "value_source": ""}, {"name": "Pine Vista", "group": "BUILT, single-family", "product": "single-family", "lat": 42.7452272, "lon": -83.3528604, "geocode_query": "", "display_name": "Independence Township / Clarkston", "builder": "Pulte", "home_type": "single-family", "year_built": "", "value_estimate": "", "value_source": ""}, {"name": "Emerson Park", "group": "BUILT, attached or condo", "product": "townhome", "lat": 42.4712935, "lon": -83.4776376, "geocode_query": "", "display_name": "Novi", "builder": "Pulte", "home_type": "townhome", "year_built": "2019-2021", "value_estimate": 470000.0, "value_source": "recent comps, 12-month median of 3 closings"}, {"name": "West Trail Preserve", "group": "BUILT ": "", "value_source": ""}, {"name": "The Villas at Forest Glen", "group": "STILL SELLING", "product": "villa", "lat": 42.7387655, "lon": -83.2504024, "geocode_query": "", "display_name": "Orion Township", "builder": "Pulte", "home_type": "condo", "year_built": "", "value_estimate": "", "value_source": ""}, {"name": "Timberside Reserve", "group": "STILL SELLING", "product": "single-family", "lat": 42.5312033, "lon": -83.5274493, "geocode_query": "", "display_name": "Wixom", "builder": "Pulte", "home_type": "single-family", "year_built": "", "value_estimate": "", "value_source": ""}, {"name": "Townes at Merrill Park", "group": "STILL SELLING", "product": "townhome", "lat": 42.5651615, "lon": -83.4466598, "geocode_query": "", "display_name": "Commerce Township", "builder": "Pulte", "home_type": "townhome", "year_built": "", "value_estimate": "", "value_source": ""}, {"name": "Ravines at Stonegate", "group": "BUILT, single-family", "product": "single-family", "lat": 42.709971224087, "lon": -83.218555587575, "geocode_query": "", "display_name": "Orion Township", "builder": "Pulte", "home_type": "single-family", "year_built": 2006, "value_estimate": "", "value_source": ""}, {"name": "Keatington Cedars", "group": "BUILT, single-family", "product": "single-family", "lat": 42.749853673561, "lon": -83.300909369245, "geocode_query": "", "display_name": "Orion Township", "builder": "Pulte Homes of Michigan", "home_type": "single-family", "year_built": 1992, "value_estimate": "", "value_source": ""}, {"name": "Meadows of Lyon", "group": "STILL SELLING", "product": "single-family", "lat": 42.444909, "lon": -83.6223978, "geocode_query": "", "display_name": "Lyon Township", "builder": "Pulte", "home_type": "single-family", "year_built": "", "value_estimate": "", "value_source": ""}, {"name": "Townes at Waldon Village", "group": "STILL SELLING", "product": "townhome", "lat": 42.736104, "lon": -83.3858686, "geocode_query": "", "display_name": "Independence Township / Clarkston", "builder": "Pulte", "home_type": "townhome", "year_built": "", "value_estimate": "", "value_source": ""}, {"name": "The Villas at Waldon Village", "group": "STILL SELLING", "product": "villa", "lat": 42.736104, "lon": -83.3858686, "geocode_query": "", "display_name": "Independence Township / Clarkston", "builder": "Pulte", "home_type": "condo", "year_built": "", "value_estimate": "", "value_source": ""}, {"name": "Reserve at West Bloomfield", "group": "STILL SELLING", "product": "single-family", "lat": 42.5539279, "lon": -83.4342013, "geocode_query": "", "display_name": "West Bloomfield Township", "builder": "Toll Brothers", "home_type": "single-family", "year_built": "", "value_estimate": "", "value_source": ""}, {"name": "Toll Brothers at The Reserve at Crystal Lake", "group": "STILL SELLING", "product": "single-family", "lat": 42.58351, "lon": -83.5326449, "geocode_query": "", "display_name": "Commerce Township", "builder": "Toll Brothers", "home_type": "single-family", "year_built": "", "value_estimate": "", "value_source": ""}, {"name": "Eagle Ridge Estates", "group": "STILL SELLING", "product": "single-family", "lat": 42.720229159689, "lon": -83.340045617046, "geocode_query": "", "display_name": "Independence Township / Clarkston", "builder": "D.R. Horton", "home_type": "single-family", "year_built": "", "value_estimate": "", "value_source": ""}, {"name": "Sanctuary Hills", "group": "STILL SELLING", "product": "single-family", "lat": 42.810607155512, "lon": -83.23163825947, "geocode_query": "", "display_name": "Oxford Township", "builder": "D.R. Horton", "home_type": "single-family", "year_built": "", "value_estimate": "", "value_source": ""}, {"name": "Wesley Park", "group": "STILL SELLING", "product": "townhome", "lat": 42.5841607, "lon": -83.1278844, "geocode_query": "", "display_name": "Troy", "builder": "M/I Homes", "home_type": "townhome", "year_built": "", "value_estimate": "", "value_source": ""}, {"name": "Sterling Trail", "group": "STILL SELLING", "product": "single-family", "lat": 42.4817369, "lon": -83.6542663, "geocode_query": "", "display_name": "Lyon Township", "builder": "Lombardo", "home_type": "single-family", "year_built": "", "value_estimate": "", "value_source": ""}, {"name": "Orchard Crossing Estates", "group": "STILL SELLING", "product": "single-family", "lat": 42.5022327, "lon": -83.6647097, "geocode_query": "", "display_name": "Lyon Township", "builder": "Lombardo", "home_type": "single-family", "year_built": "", "value_estimate": "", "value_source": ""}, {"name": "The Reserve at Crystal Lake", "group": "STILL SELLING", "product": "single-family", "lat": 42.5878735, "lon": -83.5308982, "geocode_query": "", "display_name": "Commerce Township", "builder": "Robertson Homes", "home_type": "single-family", "year_built": "", "value_estimate": "", "value_source": ""}, {"name": "Village of Troy", "group": "STILL SELLING", "product": "townhome", "lat": 42.5901172, "lon": -83.1315652, "geocode_query": "", "display_name": "Troy", "builder": "Robertson Homes", "home_type": "townhome", "year_built": "", "value_estimate": "", "value_source": ""}, {"name": "Hudson Townes", "group": "STILL SELLING", "product": "townhome", "lat": 42.5111542, "lon": -83.6060634, "geocode_query": "", "display_name": "Lyon Township", "builder": "Robertson Homes", "home_type": "townhome", "year_built": "", "value_estimate": "", "value_source": ""}];
const COLORS = {"BUILT, single-family": "#1d4e89", "BUILT, attached or condo": "#0f766e", "STILL SELLING": "#c2410c", "COMING SOON": "#6d28d9"};
const ORDER = ["BUILT, single-family", "BUILT, attached or condo", "STILL SELLING", "COMING SOON"];

const map = L.map("map", { zoomControl: true });
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

function pinIcon(color) {
  const html = '<svg width="26" height="36" viewBox="0 0 26 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
    + '<path d="M13 1C6.9 1 2 5.8 2 11.8 2 20.2 13 35 13 35s11-14.8 11-23.2C24 5.8 19.1 1 13 1z" fill="' + color + '" stroke="#fff" stroke-width="1.5"/>'
    + '<circle cx="13" cy="12" r="4.2" fill="#fff"/></svg>';
  return L.divIcon({ className: "", html: html, iconSize: [26, 36], iconAnchor: [13, 35], popupAnchor: [0, -30] });
}

function extractCity(displayName) {
  return displayName || "";
}

const layers = [];
const byGroup = {};
const builders = new Set();
const cities = new Set();

COMMUNITIES.forEach((c, i) => {
  if (c.builder) builders.add(c.builder);
  c.city = extractCity(c.display_name);
  if (c.city) cities.add(c.city);
  
  const pinColor = c.group ? COLORS[c.group] : "#52606d";
  const marker = L.marker([c.lat, c.lon], { icon: pinIcon(pinColor), title: c.name });
  
  let popup = "<strong>" + c.name + "</strong>";
  if (c.builder) popup += '<div class="popup-detail">Builder: ' + c.builder + "</div>";
  if (c.home_type) popup += '<div class="popup-detail">Type: ' + c.home_type + "</div>";
  if (c.year_built) popup += '<div class="popup-detail">Year built: ' + c.year_built + "</div>";
  if (c.value_estimate && c.value_source) {
    const value = typeof c.value_estimate === 'number' ? c.value_estimate : parseFloat(c.value_estimate) || 0;
    popup += '<div class="popup-detail">Est. value: $' + value.toLocaleString() + " (" + c.value_source + ")</div>";
  }
  if (c.group) popup += '<div class="popup-detail">' + c.group + "</div>";
  if (c.product) popup += '<div class="popup-detail">' + c.product + "</div>";
  if (c.display_name) popup += '<div class="osm">' + c.display_name + "</div>";
  
  marker.bindPopup(popup);
  marker.addTo(map);
  c._marker = marker;
  layers.push(marker);
  (byGroup[c.group] = byGroup[c.group] || []).push(c);
});

const builderFilter = document.getElementById("builder-filter");
Array.from(builders).sort().forEach(b => {
  const opt = document.createElement("option");
  opt.value = b;
  opt.textContent = b;
  builderFilter.appendChild(opt);
});

const cityFilter = document.getElementById("city-filter");
Array.from(cities).sort().forEach(c => {
  const opt = document.createElement("option");
  opt.value = c;
  opt.textContent = c;
  cityFilter.appendChild(opt);
});

let activeBuilderFilter = "";
let activeCityFilter = "";

builderFilter.addEventListener("change", (e) => {
  activeBuilderFilter = e.target.value;
  renderUI();
});

cityFilter.addEventListener("change", (e) => {
  activeCityFilter = e.target.value;
  renderUI();
});

function renderUI() {
  let filtered = COMMUNITIES;
  
  if (activeBuilderFilter) {
    filtered = filtered.filter(c => c.builder === activeBuilderFilter);
  }
  
  if (activeCityFilter) {
    filtered = filtered.filter(c => c.city === activeCityFilter);
  }
  
  COMMUNITIES.forEach(c => {
    if (filtered.includes(c)) {
      c._marker.addTo(map);
    } else {
      map.removeLayer(c._marker);
    }
  });
  
  const legend = document.getElementById("legend");
  legend.innerHTML = "";
  ORDER.forEach(g => {
    const n = filtered.filter(c => c.group === g).length;
    const row = document.createElement("div");
    row.className = "legend-row";
    row.innerHTML = '<span class="swatch" style="background:' + COLORS[g] + '"></span><span>'
      + g + (g === "COMING SOON" ? " (none plotted)" : " (" + n + ")") + "</span>";
    legend.appendChild(row);
  });
  
  const lists = document.getElementById("lists");
  lists.innerHTML = "";
  ORDER.forEach(g => {
    const items = filtered.filter(c => c.group === g);
    if (!items.length) return;
    const h = document.createElement("div");
    h.className = "group-label";
    h.textContent = g;
    lists.appendChild(h);
    const ul = document.createElement("ul");
    ul.className = "places";
    items.forEach(c => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = c.name;
      b.addEventListener("click", () => {
        map.setView([c.lat, c.lon], 15);
        c._marker.openPopup();
      });
      li.appendChild(b);
      ul.appendChild(li);
    });
    lists.appendChild(ul);
  });
}

renderUI();

const bounds = L.latLngBounds(COMMUNITIES.map(c => [c.lat, c.lon]));
map.fitBounds(bounds.pad(0.15));
</script>
</body>
</html>
